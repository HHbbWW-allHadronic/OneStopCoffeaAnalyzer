{% import 'boosted_core.yaml' as core %}

{%- macro signalmc_pipelines() %}
      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1

      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
      - withHLT_ObjDef5
      - withHLT_ObjDef6
      - noHLT_ObjDef1
{%- endmacro %}

{%- macro mc_pipelines() %}
      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1

      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
      - withHLT_ObjDef5
      - withHLT_ObjDef6
      - noHLT_ObjDef1
{%- endmacro %}

{%- macro data_pipelines() %}

      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1
      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
      - withHLT_ObjDef5
      - withHLT_ObjDef6
      - noHLT_ObjDef1
{%- endmacro %}


common_histograms: &common_histograms
    
- module_name: SimpleHistogram
  hist_name: gFatJet_globalParT3_QCD
  input_cols: [boostedFatJet.globalParT3_QCD]
  axes:
    - name: "GlobalParT3 QCD Score"
      start: 0
      stop: 1
      bins: 20


- module_name: SimpleHistogram
  hist_name: gFatJet_globalParT3_Xbb
  input_cols: [boostedFatJet.globalParT3_Xbb]
  axes:
