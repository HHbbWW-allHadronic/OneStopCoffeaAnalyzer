{{ core.objects() }}
{{ core.regions() }}

analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  withHLT_NoSelection:
    - *withHLT_NoSelection
    - *common_histograms

  NoSelection:
    - *NoSelection
    - *common_histograms

  withHLT_ObjDef1:
    - *withHLT_ObjDef1
    - *common_histograms

  withHLT_ObjDef2:
    - *withHLT_ObjDef2
    - *common_histograms


  withHLT_ObjDef3:
    - *withHLT_ObjDef3
    - *common_histograms


  withHLT_ObjDef4:
    - *withHLT_ObjDef4
    - *common_histograms



  withHLT_ObjDef5:
    - *withHLT_ObjDef5
    - *common_histograms

  withHLT_ObjDef6:
    - *withHLT_ObjDef6
    - *common_histograms

  noHLT_ObjDef1:
    - *noHLT_ObjDef1
    - *common_histograms


location_priorities: [".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: 'ggHH2b2V6q_2024*'
    pipelines: 
    {{ signalmc_pipelines() }}
  - dataset: 'data_HHParking_2024*'
    pipelines:
    {{ data_pipelines() }} 
  - dataset: 'qcd*2024*'
    pipelines:
    {{ mc_pipelines() }}
  - dataset: 'tt_hadronic*2024*'
    pipelines:
    {{ mc_pipelines() }}
  - dataset: 'tt_semilep*2024'
    pipelines:
    {{ mc_pipelines() }}
