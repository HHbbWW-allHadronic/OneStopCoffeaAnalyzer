{% import 'boosted_core.yaml' as core %}

{%- macro signalmc_pipelines() %}
      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1

      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
      - noHLT_ObjDef1
{%- endmacro %}

{%- macro mc_pipelines() %}
      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1

      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
      - noHLT_ObjDef1
{%- endmacro %}

{%- macro data_pipelines() %}

      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1
      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
      - noHLT_ObjDef1
{%- endmacro %}


