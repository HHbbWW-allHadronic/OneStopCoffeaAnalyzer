{% import 'core.yaml' as core %}

{%- macro all_pipelines() %}
      - withHLT_ObjDef1
      - withHLT_ObjDef3
{%- endmacro %}

{{ core.objects() }}
{{ core.regions() }}

analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  withHLT_ObjDef1:
    - *withHLT_ObjDef1
    - module_name: SaveEventsH5
      prefix: root://cmseos.fnal.gov//store/user/jgehrke/skims/2024/withHLT_ObjDef1
      jet_col: goodJet
      jet_vars: [pt, eta, phi, mass, btag]
      n_jets: 6
      event_vars: [HT, b_dijet.mass, nontop2b_fourjet.mass]

  withHLT_ObjDef3:
    - *withHLT_ObjDef3
    - module_name: SaveEventsH5
      prefix: root://cmseos.fnal.gov//store/user/jgehrke/skims/2024/withHLT_ObjDef3
      jet_col: goodJet
      jet_vars: [pt, eta, phi, mass, btag]
      n_jets: 6
      event_vars: [HT, b_dijet.mass, nontop2b_fourjet.mass]

location_priorities: [".*FNAL.*", ".*US.*", ".*(DE|IT|CH|FR).*", ".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: 'ggHH2b2V6q_2024*'
    pipelines: 
    {{ all_pipelines() }}
  - dataset: 'qcd*2024*'
    pipelines:
    {{ all_pipelines() }}
  - dataset: 'tt_hadronic*2024*'
    pipelines:
    {{ all_pipelines() }}
  - dataset: 'tt_semilep*2024'
    pipelines:
    {{ all_pipelines() }}
