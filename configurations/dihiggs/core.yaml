{% macro objects() -%}
common_objects: &common_objects
  - module_name: JetID
    input_col: Jet
    output_col: Jet.jetId
  - module_name: HElectronMaker
    input_col: Electron
    output_col: tightElectron
    working_point: "tight"
    min_pt: 15
    max_abs_eta: 2.5
    max_abs_dxy:
      barrel: 0.05
      endcap: 0.1
    max_abs_dz:
      barrel: 0.1
      endcap: 0.2

  - module_name: HElectronMaker
    input_col: Electron
    output_col: looseElectron
    working_point: "loose"
    min_pt: 7
    max_abs_eta: 2.5

  - module_name: HMuonMaker
    input_col: Muon
    output_col: tightMuon
    id_working_point: "tightId"
    min_pt: 15
    max_abs_eta: 2.4
    iso_working_pt: "tight"

  - module_name: HMuonMaker
    input_col: Muon
    output_col: looseMuon
    id_working_point: "looseId"
    min_pt: 5
    max_abs_eta: 2.4
    iso_working_pt: "loose"

  - module_name: HJetFilter
    input_col: Jet
    output_col: goodJet
    include_pu_id: False
    include_jet_id: True
    min_pt: 25
    max_abs_eta: 2.4

#  - module_name: DRVetoFilter
#    input_col: tightElectronPreCleaning
#    output_col: tightElectron
#    veto_cols: [goodJet]
#    veto_dr: 0.4

#  - module_name: DRVetoFilter
#    input_col: looseElectronPreCleaning
#    output_col: looseElectron
#    veto_cols: [goodJet]
#    veto_dr: 0.4

#  - module_name: DRVetoFilter
#    input_col: tightMuonPreCleaning
#    output_col: tightMuon
#    veto_cols: [goodJet]
#    veto_dr: 0.4

#  - module_name: DRVetoFilter
#    input_col: looseMuonPreCleaning
#   output_col: looseMuon
#   veto_cols: [goodJet]
#   veto_dr: 0.4

  - module_name: HBQuarkMaker
    input_col: goodJet
    output_col: MedB
    working_point: M
    nontop2b: True
    nontop2b_col: nontop2b_med

  - module_name: HBQuarkMaker
    input_col: goodJet
    output_col: TightB
    working_point: T
    nontop2b: True
    nontop2b_col: nontop2b_tight


  - module_name: HCQuarkMaker
    input_col: goodJet
    output_col: MedC
    working_point: M
    notc_col: notC_med
    nontop2b: True
    nontop2b_col: nontop2c_med

  - module_name: HCQuarkMaker
    input_col: goodJet
    output_col: TightC
    working_point: T
    notc_col: notC_tight
    nontop2b: True
    nontop2b_col: nontop2c_tight


  - module_name: HT
    input_col: Jet
    output_col: AK4HT

  - module_name: HT
    input_col: goodJet
    output_col: HT

  - module_name: Count
    input_col: Jet
    output_col: NAK4Jet

  - module_name: Count
    input_col: goodJet
    output_col: NJet

  - module_name: Count
    input_col: MedB
    output_col: NMedB

  - module_name: Count
    input_col: TightB
    output_col: NTightB

  - module_name: Count
    input_col: MedC
    output_col: NMedC

  - module_name: Count
    input_col: TightC
    output_col: NTightC

  - module_name: Count
    input_col: looseMuon
    output_col: NlooseMuon

  - module_name: Count
    input_col: tightMuon
    output_col: NtightMuon

  - module_name: Count
    input_col: looseElectron
    output_col: NlooseElectron

  - module_name: Count
    input_col: tightElectron
    output_col: NtightElectron
{%- endmacro %}

{% macro regions() -%}
hlt_selection: &hlt_selection
  - module_name: SimpleHLT
    triggers: [250HT4J2B]
  - module_name: ScalarCut
    input_col: HT
    selection_name: HT300
    min_val: 300

eventlevel_selection: &eventlevel_selection
  - module_name: GoldenLumi
  - module_name: VetoMap
    input_col: Jet
  - module_name: VetoMapFilter
    input_col: Jet
    output_col: Jet
  - module_name: NoiseFilter

