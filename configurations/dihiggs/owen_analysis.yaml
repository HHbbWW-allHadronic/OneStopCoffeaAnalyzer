{% import 'core.yaml' as core %}

{%- macro signalmc_pipelines() %}
      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1
      - noHLT_ObjDef1
      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
{%- endmacro %}

{%- macro mc_pipelines() %}
      - withHLT_NoSelection
      - NoSelection
      - withHLT_ObjDef1
      - noHLT_ObjDef1
      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
{%- endmacro %}

{%- macro data_pipelines() %}
      - withHLT_NoSelection
      - withHLT_ObjDef1
      - withHLT_ObjDef2
      - withHLT_ObjDef3
      - withHLT_ObjDef4
{%- endmacro %}


common_histograms: &common_histograms
    

  - module_name: SimpleHistogram
    hist_name: gJetCvsBtag
    input_cols: [goodJet.btagUParTAK4CvB]
    axes:
      - name: "Jet CvsB Score"
        start: 0
        stop: 1
        bins: 20


  - module_name: SimpleHistogram
    hist_name: JetCvsLtag
    input_cols: [goodJet.btagUParTAK4CvL]
    axes:
      - name: "Jet CvsL Score"
        start: 0
        stop: 1
        bins: 20


  - module_name: SimpleHistogram
    hist_name: JetCvsnBtag
    input_cols: [goodJet.btagUParTAK4CvNotB]
    axes:
      - name: "Jet CvsnB Score"
        start: 0
        stop: 1
        bins: 20

  - module_name: FourVecHistograms
    input_col: MedC
    hist_name: MedC

  - module_name: HCQuarkMaker
    input_col: goodJet
    output_col: MedC
    output_mask_col: goodJet.isMedC
    working_point: "M"

  - module_name: SimpleHistogram
    hist_name: MedCN
    input_cols: [NMedC]
    axes:
      - name: "$N_{c}$"
        start: -0.5
        stop: 13.5
        bins: 14

  - module_name: JetVarRankHistograms
    hist_name: Jet_isMedC_Ranked
    input_col: goodJet.isMedC
    axis:
      name: "Is C-Jet_{idx}"
      start: -0.5
      stop: 1.5
      bins: 2


  - module_name: FractionHC
    input_col_num: NMedC
    input_col_den: NJet
    output_col: MyFractionCol
 
  - module_name: SimpleHistogram
    hist_name: FractionofC
    input_cols: [MyFractionCol]
    axes:
      - name: "$Frac_{c}$"
        start: 0
        stop: 1
        bins: 10

  - module_name: JetVarRankHistograms
    hist_name: MedC_pt
    input_col: MedC.pt 
    axis: 
      name: "Jet $Pt_{c,idx}$"
      start: 0
      stop: 1000
      bins: 20


  - module_name: FourVecHistograms
    input_col: TightC
    hist_name: TightC

  - module_name: SimpleHistogram
    hist_name: TightCN
    input_cols: [NTightC]
    axes:
      - name: "$N_{b}$"
        start: -0.5
        stop: 13.5
        bins: 14

  - module_name: JetVarRankHistograms
    hist_name: gJetCvsBtag
    input_col: goodJet.btagUParTAK4CvB
    axis:
      name: "Jet $CvsB Score_{idx}$"
      start: 0
      stop: 1
      bins: 20

  - module_name: JetVarRankHistograms
    hist_name: JetCvsLtag
    input_col: goodJet.btagUParTAK4CvL
    axis:
      name: "Jet $CvsL Score_{idx}$"
      start: 0
      stop: 1
      bins: 20






{{ core.objects() }}
{{ core.regions() }}

analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  withHLT_NoSelection:
    - *withHLT_NoSelection
    - *common_histograms

  NoSelection:
    - *NoSelection
    - *common_histograms

  withHLT_ObjDef1:
    - *withHLT_ObjDef1
    - *common_histograms

  noHLT_ObjDef1:
    - *noHLT_ObjDef1
    - *common_histograms

  withHLT_ObjDef2:
    - *withHLT_ObjDef2
    - *common_histograms

  withHLT_ObjDef3:
    - *withHLT_ObjDef3
    - *common_histograms

  withHLT_ObjDef4:
    - *withHLT_ObjDef4
    - *common_histograms 





location_priorities: [".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: 'data_HHParking_2024*'
    pipelines:
    {{ data_pipelines() }}
  - dataset: 'ggHH2b2V6q_2024*'
    pipelines: 
    {{ signalmc_pipelines() }}
  - dataset: 'qcd*2024*'
    pipelines:
    {{ mc_pipelines() }}
  - dataset: 'tt_hadronic*2024*'
    pipelines:
    {{ mc_pipelines() }}
  - dataset: 'tt_semilep*2024'
    pipelines:
    {{ mc_pipelines() }}
