        - [0, 1, 2]
      output_cols:
        - Baseline.H2_threejet_pt_sorted

    - module_name: SimpleHistogram
      hist_name: m_HWW_baseline_threejet_from_fourjet_1d
      input_cols: [Baseline.H2_threejet_pt_sorted.mass]
      axes:
        - name: nontop2b_threejet, from fourjet subset (baseline)
          start: 0
          stop: 600
          bins: 50
          unit: GeV

    - module_name: SimpleHistogram
      hist_name: W_on_SPANet_1d
      input_cols: [SPANet.W_on_combo.mass]
      axes:
        - name: W_on mass, q1+q2 (SPANet assignment)
          start: 0
          stop: 600
          bins: 50
          unit: GeV

    - module_name: SimpleHistogram
