{% import 'core.yaml' as core %}

{{ core.objects() }}
{{ core.regions() }}

analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  withHLT_ObjDef9:
    - *withHLT_ObjDef9

    - module_name: PromoteAttributeToBracket
      input_col: lowJet
      nest_col: storedE
      attribute_name: e

    - module_name: ABCDiHiggsInference
      jet_col: lowJet
      jet_vars: [pt, eta, phi, storedE, btag, btagPNetQvG, btagUParTAK4CvB, btagUParTAK4CvL]
      global_cols: [HT, nontop2b_qvg_threejet.mass, b_dijet.mass]
      output_cols: [Disc1]
      model_path: nn_models/skim9_mlp_sd30_s42/model_best.pt
      preprocessing_path: nn_models/skim9_mlp_sd30_s42/preprocessing.json

    - module_name: SimpleHistogram
      hist_name: Disc1_sig
      input_cols: [Disc1.sig]
      axes:
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_tt
      input_cols: [Disc1.tt]
      axes:
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_qcd
      input_cols: [Disc1.qcd]
      axes:
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_sig_b_dijet_mass_2d
      input_cols: [b_dijet.mass, Disc1.sig]
      axes:
        - name: b_dijet $m_{01}$
          start: 0
          stop: 500
          bins: 20
          unit: GeV
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_tt_b_dijet_mass_2d
      input_cols: [b_dijet.mass, Disc1.tt]
      axes:
        - name: b_dijet $m_{01}$
          start: 0
          stop: 500
          bins: 20
          unit: GeV
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_qcd_b_dijet_mass_2d
      input_cols: [b_dijet.mass, Disc1.qcd]
      axes:
        - name: b_dijet $m_{01}$
          start: 0
          stop: 500
          bins: 20
          unit: GeV
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_sig_nontop2b_fourjet_mass_2d
      input_cols: [nontop2b_fourjet.mass, Disc1.sig]
      axes:
        - name: nontop2b_fourjet $m_{0123}$
          start: 0
          stop: 500
          bins: 20
          unit: GeV
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_tt_nontop2b_fourjet_mass_2d
      input_cols: [nontop2b_fourjet.mass, Disc1.tt]
      axes:
        - name: nontop2b_fourjet $m_{0123}$
          start: 0
          stop: 500
          bins: 20
          unit: GeV
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_qcd_nontop2b_fourjet_mass_2d
      input_cols: [nontop2b_fourjet.mass, Disc1.qcd]
      axes:
        - name: nontop2b_fourjet $m_{0123}$
          start: 0
          stop: 500
          bins: 20
          unit: GeV
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_sig_HT_2d
      input_cols: [HT, Disc1.sig]
      axes:
        - name: HT
          start: 0
          stop: 3000
          bins: 60
          unit: GeV
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_tt_HT_2d
      input_cols: [HT, Disc1.tt]
      axes:
        - name: HT
          start: 0
          stop: 3000
          bins: 60
          unit: GeV
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20

    - module_name: SimpleHistogram
      hist_name: Disc1_qcd_HT_2d
      input_cols: [HT, Disc1.qcd]
      axes:
        - name: HT
          start: 0
          stop: 3000
          bins: 60
          unit: GeV
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: JetVarRankHistograms
      hist_name: lowJet_pt_{}_2d
      input_col: lowJet.pt
      axis:
        name: "lowJet $p_{T,idx}$"
        start: 0
        stop: 1000
        bins: 20
        unit: GeV
      second_names: [Disc1_sig, Disc1_tt, Disc1_qcd]
      second_cols: [Disc1.sig, Disc1.tt, Disc1.qcd]
      second_axes:
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: JetVarRankHistograms
      hist_name: lowJet_eta_{}_2d
      input_col: lowJet.eta
      axis:
        name: "lowJet $\\eta_{idx}$"
        start: -4
        stop: 4
        bins: 20
      second_names: [Disc1_sig, Disc1_tt, Disc1_qcd]
      second_cols: [Disc1.sig, Disc1.tt, Disc1.qcd]
      second_axes:
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: JetVarRankHistograms
      hist_name: lowJet_phi_{}_2d
      input_col: lowJet.phi
      axis:
        name: "lowJet $\\phi_{idx}$"
        start: -4
        stop: 4
        bins: 20
      second_names: [Disc1_sig, Disc1_tt, Disc1_qcd]
      second_cols: [Disc1.sig, Disc1.tt, Disc1.qcd]
      second_axes:
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20

    - module_name: JetVarRankHistograms
      hist_name: lowJet_mass_{}_2d
      input_col: lowJet.mass
      axis:
        name: "lowJet $m_{idx}$"
        start: 0
        stop: 250
        bins: 20
        unit: GeV
      second_names: [Disc1_sig, Disc1_tt, Disc1_qcd]
      second_cols: [Disc1.sig, Disc1.tt, Disc1.qcd]
      second_axes:
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20 

    - module_name: JetVarRankHistograms
      hist_name: lowJet_btag_{}_2d
      input_col: lowJet.btagUParTAK4B
      axis:
        name: "lowJet UParTB$_{idx}$"
        start: 0
        stop: 1
        bins: 20
      second_names: [Disc1_sig, Disc1_tt, Disc1_qcd]
      second_cols: [Disc1.sig, Disc1.tt, Disc1.qcd]
      second_axes:
        - name: Disc. 1 (sig)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (tt)
          start: 0
          stop: 1
          bins: 20
        - name: Disc. 1 (qcd)
          start: 0
          stop: 1
          bins: 20 

location_priorities: [".*FNAL.*", ".*US.*", ".*(DE|IT|CH|FR).*", ".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: 'ggHH2b2V6q_eval_2024*'
    pipelines: 
      - withHLT_ObjDef9
  {# - dataset: 'qcd_inclusive_2024*'
    pipelines:
      - withHLT_ObjDef9
  - dataset: 'tt_hadronic_2024*'
    pipelines:
      - withHLT_ObjDef9
  - dataset: 'tt_semileptonic_2024*'
    pipelines:
      - withHLT_ObjDef9 #}
