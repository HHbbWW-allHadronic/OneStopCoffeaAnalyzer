Postprocessing:
  default_plot_config: &default_plot_config
    cms_text: "Preliminary"
    image_type: ".png"
    cms_text_color: Black
    legend_num_cols: 1
  default_style_set: &default_style_set
    styles:
      - pattern:
          dataset_name: 'data*'
        style:
          plottype: errorbar
          color: black
          linestyle: null
          marker: 'o'


  processors:
    - name: PlotSelectionFlow
      inputs:
        - "*/*/*/*selection"
      scale: linear
      show_yields: True
      normalize: True
      plot_configuration:
        <<: *default_plot_config
        extra_text: "{pipeline}"
      structure:
        select: {type: SelectionFlow}
        group: {era.name: "*", pipeline: "*", name: "*", dataset_name: "*"}
      output_name: "plots/{era.name}/{pipeline}/{name}_cutflow_{dataset_name}.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      normalize: False
      show_info: False
      style_set: *default_style_set
      plot_configuration:
        <<: *default_plot_config
      structure:
        select: {name: "re:^(?!.*selection$|all_triggers$|.*2d).*"}
        group: {pipeline: "*", era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/{pipeline}/{name}_{dataset_name}"

    - name: Histogram2D
      inputs:
        - "*/*/*/*2d*"
      scale: linear
      normalize: False
      style_set: *default_style_set
      plot_configuration:
        cms_text_color: "black"
        <<: *default_plot_config
        extra_text: "{dataset_title}"
      structure:
        select: {dataset_name: "*"}
        group: {pipeline: "*", era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/{pipeline}/{name}_{dataset_name}"

    - name: RatioPlot
      inputs:
        - "*/*/*/*"
      ratio_type: "efficiency"
      ratio_ylim: [0, 1.1]
      ratio_height: 1
      show_den_unc: True
      no_stack: True
      scale: linear
      structure:
        select: {dataset_name: "ggHH2b2V6q*", name: "re:^(?!.*selection$|all_triggers$|.*2d).*", pipeline: "*NoSelection"}
        group: {era.name: "*", name: "*"}
        subgroups:
          denominator:
            select: {pipeline: NoSelection}
            transforms:
              - name: FormatTitle
                title_format: "{pipeline}"
          numerator:
            select: {pipeline: withHLT_NoSelection}
            transforms:
              - name: FormatTitle
                title_format: "{pipeline}"
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: SliceAxes
            slices: {0: [0,1200]}
      output_name: "plots/{era.name}/withHLT_NoSelection/trigger_eff_{name}.png"

    - name: RatioPlot
      inputs:
        - "*/*/*/*"
      ratio_type: "efficiency"
      ratio_ylim: [0, 1.1]
      ratio_height: 1
      show_den_unc: True
      no_stack: True
      scale: linear
      structure:
        select: {dataset_name: "ggHH2b2V6q*", name: "re:^(?!.*selection$|all_triggers$|.*2d).*"}
        group: {era.name: "*", name: "*"}
        subgroups:
          denominator:
            select: {pipeline: noHLT_ObjDef9}
            transforms:
              - name: FormatTitle
                title_format: "{pipeline}"
          numerator:
            select: {pipeline: withHLT_ObjDef9}
            transforms:
              - name: FormatTitle
                title_format: "{pipeline}"
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/withHLT_ObjDef9/trigger_eff_{name}.png"

    - name: RatioPlot
      inputs:
        - "*/*/*/*"
      ratio_type: "efficiency"
      ratio_ylim: [0, 1.1]
      ratio_height: 1
      show_den_unc: True
      no_stack: True
      scale: linear
      structure:
        select: {dataset_name: "ggHH2b2V6q*", name: "re:^(?!.*selection$|all_triggers$|.*2d).*"}
        group: {era.name: "*", name: "*"}
        subgroups:
          denominator:
            select: {pipeline: FullSample}
            transforms:
              - name: FormatTitle
                title_format: "{pipeline}"
          numerator:
            select: {pipeline: withHLT_ObjDef9}
            transforms:
              - name: FormatTitle
                title_format: "{pipeline}"
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/withHLT_ObjDef9/eff_{name}.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      normalize: True
      show_info: False
      style_set: *default_style_set
      plot_configuration:
        <<: *default_plot_config
        x_label: "$H_T$ [GeV]"
        x_max: 1600
      structure:
        select: {name: "re:^(?!.*selection$|.*LHE_HT$|all_triggers$|.*2d).*"}
        group: {pipeline: "*", era.name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: SumHistograms
            sum_match_pattern: {name: "AK4HT"}
            new_meta_fields:
              title: "AK4"
          - name: SumHistograms
            sum_match_pattern: {name: "lowJetHT"}
            new_meta_fields:
              title: "lowJet"
          - name: SumHistograms
            sum_match_pattern: {name: "HT"}
            new_meta_fields:
              title: "goodJet"
          - name: SumHistograms
            sum_match_pattern: {name: "GenJetHT"}
            new_meta_fields:
              title: "GenJet"
      output_name: "plots/{era.name}/{pipeline}/HT_comparison_{dataset_name}.png"

    - name: CDFPlot
      inputs:
        - "*/*/*/*"
      direction: below
      scale: linear
      include_flow: True
      as_percent: False
      hlines: [0.1]
      style_set: *default_style_set
      plot_configuration:
        <<: *default_plot_config
      structure:
        select: {name: "re:^(?!.*selection$|all_triggers$|.*2d).*"}
        group: {pipeline: "*", era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/{pipeline}/cdf_{name}_{dataset_name}"

    - name: CDFPlot
      inputs:
        - "*/*/*/*"
      direction: below
      scale: linear
      include_flow: True
      hlines: [0.1]
      annotate_cuts: True
      style_set: *default_style_set
      plot_configuration:
        <<: *default_plot_config
        extra_text: "{dataset_title}"
      structure:
        select:
          dataset_name: "ggHH2b2V6q*"
          name: "re:^(?!.*selection$|all_triggers$|.*2d).*"
          pipeline: "re:^(FullSample|withHLT_ObjDef9)$"
        group: {era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: FormatTitle
            title_format: "{pipeline}"
      output_name: "plots/{era.name}/withHLT_ObjDef9/cdf_vs_FullSample_{name}_{dataset_name}"

    - name: CDFPlot
      inputs:
        - "*/*/*/*"
      direction: below
      scale: linear
      include_flow: True
      hlines: [0.1]
      annotate_cuts: True
      style_set: *default_style_set
      plot_configuration:
        <<: *default_plot_config
        extra_text: "{dataset_title}"
      structure:
        select:
          dataset_name: "ggHH2b2V6q*"
          name: "re:^(?!.*selection$|all_triggers$|.*2d).*"
          pipeline: "re:^(FullSample|withHLT_ObjDef9_Matched)$"
        group: {era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: FormatTitle
            title_format: "{pipeline}"
      output_name: "plots/{era.name}/withHLT_ObjDef9_Matched/cdf_vs_FullSample_{name}_{dataset_name}"