{% import 'core.yaml' as core %}

{%- macro all_pipelines() %}
      - withHLT_ObjDef9
{%- endmacro %}

{{ core.objects() }}
{{ core.regions() }}

analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  withHLT_ObjDef9:
    - *withHLT_ObjDef9
    - module_name: PromoteAttributeToBracket
      input_col: lowJet
      nest_col: storedE
      attribute_name: e
    - module_name: SaveEventsH5
      prefix: root://cmseos.fnal.gov//store/user/jgehrke/skims/2024/withHLT_ObjDef9
      jet_col: lowJet
      jet_vars: [pt, eta, phi, storedE, btag, btagPNetQvG, btagUParTAK4CvB, btagUParTAK4CvL]
      n_jets: 6
      event_vars: [HT, b_dijet.mass, nontop2b_qvg_threejet.mass]

location_priorities: [".*FNAL.*", ".*US.*", ".*(DE|IT|CH|FR).*", ".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: 'ggHH2b2V6q_training_2024*'
    pipelines: 
    {{ all_pipelines() }}
  - dataset: 'qcd*2024*'
    pipelines:
    {{ all_pipelines() }}
  - dataset: 'tt_hadronic*2024*'
    pipelines:
    {{ all_pipelines() }}
  - dataset: 'tt_semilep*2024'
    pipelines:
    {{ all_pipelines() }}
