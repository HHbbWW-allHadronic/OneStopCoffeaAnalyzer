{% import 'core.yaml' as core %}

{%- macro all_pipelines() %}
      - withHLT_ObjDef9_Matched
      - withHLT_ObjDef9
      - noHLT_ObjDef9
      - withHLT_NoSelection
      - NoSelection
      - FullSample
{%- endmacro %}

{{ core.objects() }}
{{ core.regions() }}

HT_stuff: &HT_stuff
  - module_name: HT
    input_col: GenJet
    output_col: GenJetHT

  - module_name: Count
    input_col: GenJet
    output_col: GenJetN

  - module_name: SimpleHistogram
    hist_name: GenJetN
    input_cols: [GenJetN]
    axes:
      - name: "$N_{GenJets}$"
        start: -0.5
        stop: 13.5
        bins: 14

  - module_name: SimpleHistogram
    hist_name: GenJetHT  
    input_cols: [GenJetHT]
    axes:
      - name: "GenJet $H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"
  - module_name: SimpleHistogram
    hist_name: HT
    input_cols: [HT]
    axes:
        - name: "$H_{T}$"
          start: 0
          stop: 1600
          bins: 40
          unit: "GeV"
  - module_name: SimpleHistogram
    hist_name: AK4HT
    input_cols: [AK4HT]
    axes:
        - name: "AK4 $H_{T}$"
          start: 0
          stop: 1600
          bins: 40
          unit: "GeV"
  - module_name: SimpleHistogram
    hist_name: lowJetHT
    input_cols: [lowJetHT]
    axes:
        - name: "lowJet $H_{T}$"
          start: 0
          stop: 1600
          bins: 40
          unit: "GeV"
  - module_name: SimpleHistogram
    hist_name: GenJetHT_vs_HT_2d
    input_cols: [GenJetHT, HT]
    axes:
      - name: "GenJet $H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"
      - name: "$H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"
  - module_name: SimpleHistogram
    hist_name: GenJetHT_vs_AK4HT_2d
    input_cols: [GenJetHT, AK4HT]
    axes:
      - name: "GenJet $H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"
      - name: "AK4 $H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"
  - module_name: SimpleHistogram
    hist_name: GenJetHT_vs_lowJetHT_2d
    input_cols: [GenJetHT, lowJetHT]
    axes:
      - name: "GenJet $H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"
      - name: "lowJet $H_{T}$"
        start: 0
        stop: 1600
        bins: 40
        unit: "GeV"


  - module_name: JoeHHGenParticles
    input_col: GenPart
    output_cols:
      b1: b1
      b2: b2
      q1: q1
      q2: q2
      q3: q3
      q4: q4
      nonh_mother_zero: nonh_mother_zero
      nonh_mother_zero_idx: nonh_mother_zero_idx

  - module_name: SimpleHistogram
    hist_name: b1_pt
    input_cols: [b1.pt]
    axes:
      - name: "b1 $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV
  - module_name: SimpleHistogram
    hist_name: b2_pt
    input_cols: [b2.pt]
    axes:
      - name: "b2 $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV
  - module_name: SimpleHistogram
    hist_name: q1_pt
    input_cols: [q1.pt]
    axes:
      - name: "q1 $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV
  - module_name: SimpleHistogram
    hist_name: q2_pt
    input_cols: [q2.pt]
    axes:
      - name: "q2 $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV
  - module_name: SimpleHistogram
    hist_name: q3_pt
    input_cols: [q3.pt]
    axes:
      - name: "q3 $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV
  - module_name: SimpleHistogram
    hist_name: q4_pt
    input_cols: [q4.pt]
    axes:
      - name: "q4 $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV
  - module_name: SimpleHistogram
    hist_name: nonh_mother_zero_pt
    input_cols: [nonh_mother_zero.pt]
    axes:
      - name: "nonh_mother_zero $p_{T}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV


spanet_selection: &spanet_selection
  - module_name: SPANetGenMatch
    jet_col: lowJet
    genpart_col: GenPart          
    genjet_col: GenJet            
    output_prefix: SPANet
    reco_mode: full_hww
    n_real_jets: 7
    n_null_jets: 1
    dr_threshold: 0.4
    genjet_eta_cut: 2.4
    genjet_pt_cut: 15.0
    secondary_order_field: qvg
    include_isr_target: false

analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  FullSample:
    - *FullSample
    - *HT_stuff

  NoSelection:
    - *NoSelection
    - *HT_stuff

  withHLT_NoSelection:
    - *withHLT_NoSelection
    - *HT_stuff

  noHLT_ObjDef9:
    - *noHLT_ObjDef9
    - *HT_stuff

  withHLT_ObjDef9:
    - *withHLT_ObjDef9
    - *HT_stuff
  
  withHLT_ObjDef9_Matched:
    - *withHLT_ObjDef9
    - *spanet_selection
    - *HT_stuff

location_priorities: [".*FNAL.*", ".*US.*", ".*(DE|IT|CH|FR).*", ".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: 'ggHH2b2V6q_training_2024*'
    pipelines: 
    {{ all_pipelines() }}