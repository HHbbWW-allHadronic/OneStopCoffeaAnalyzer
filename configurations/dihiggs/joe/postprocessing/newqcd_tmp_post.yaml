Postprocessing:
  default_plot_config: &default_plot_config
    cms_text: "Preliminary"
    image_type: ".png"
    cms_text_color: Black
    legend_num_cols: 1
  default_style_set: &default_style_set
    styles:
      - pattern:
          dataset_name: 'data*'
        style:
          plottype: errorbar
          color: black
          linestyle: null
          marker: 'o'


  processors:
    - name: PlotSelectionFlow
      inputs:
        - "*/*/*/*selection"
      scale: log
      show_yields: True
      normalize: True
      plot_configuration:
        <<: *default_plot_config
        extra_text: "{pipeline}"
      structure:
        select: {type: SelectionFlow}
        group: {era.name: "*", pipeline: "*", name: "*", dataset_name: "*"}
      output_name: "plots/{era.name}/{pipeline}/{name}_cutflow_{dataset_name}.png"

    - name: Histogram2D
      inputs:
        - "*/*/*/*2d*"
      scale: log
      normalize: False
      style_set: *default_style_set
      plot_configuration:
        cms_text_color: "black"
        <<: *default_plot_config
        extra_text: "{dataset_title}"
      structure:
        select: {dataset_name: "*"}
        group: {pipeline: "*", era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/{pipeline}/{name}_{dataset_name}"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      scale: log
      normalize: False
      show_info: False
      style_set: *default_style_set
      structure:
        select: {dataset_name: "*", name: "re:^(?!.*selection$|all_triggers$|.*2d).*"}
        group: {pipeline: "*", era.name: "*", name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "plots/{era.name}/{pipeline}/{name}"

    - name: RatioPlot
      inputs:
        - "*/*/*/b_dijet_mass"
        - "*/*/*/nontop2b_fourjet_mass"
        - "*/*/*/nontop2b_threejet_mass"
        - "*/*/*/nontop2b_qvg_threejet_mass"
        - "*/*/*/nontop2b_qvg_fourjet_mass"
        - "*/*/*/JetN"
        - "*/*/*/HWW_SPANet_mass"
        - "*/*/*/Hbb_SPANet_mass"
        - "*/*/*/HW_SPANet_mass"
      ratio_type: "significance"
      show_den_unc: True
      scale: log
      ratio_ylim: null
      ratio_hlines: []
      plot_configuration:
        <<: *default_plot_config
        extra_text: "{pipeline}"
      structure:
        select: {dataset_name: "*", name: "*", pipeline: "*", sample_type: "MC"}
        group: {era.name: "*", name: "*", pipeline: "*"}
        subgroups:
          denominator:
            select: {dataset_name: "!ggHH2b2V6q*"}
          numerator:
            select: {dataset_name: "ggHH2b2V6q*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: SumHistograms
            sum_match_pattern: {dataset_name: "tt*"}
            new_meta_fields:
              dataset_name: "tt"
              dataset_title: "$t\\overline{t}$"
      output_name: "plots/{era.name}/{pipeline}/significance_{name}.png"
