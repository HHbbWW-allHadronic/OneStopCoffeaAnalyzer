Postprocessing:
  processors:
    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      scale: linear
      normalize: True
      show_info: True
      plot_configuration:
        cms_text: "Preliminary"
        image_type: ".png"
        cms_text_color: Black
        legend_num_cols: 1
        legend_fontsize: 8
      structure:
        select: {dataset_name: "*", name: "*_1d"}
        group: {pipeline: "*", era.name: "*", name: "*"}
        transforms:
          - name: SplitAxes
            split_axis_names: {"variation": "central"}
      output_name: "plots-2024-region5-plots/{era.name}/{pipeline}/{name}.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      scale: linear
      normalize: false
      show_info: True
      structure:
        select: {dataset_name: "*", name: "*_1d"}
        group: {pipeline: "*", era.name: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SplitAxes
            split_axis_names: {"variation": "central"}
      output_name: "plots-2024-region5-plots/{era.name}/{pipeline}/{dataset_name}/{name}.png"

    - name: Histogram2D
      inputs:
        - "*/*/*/*"
      scale: log
      color_scale: log
      normalize: False
      vmin: 0.0
      vmax: 3.0
      structure:
        select: {dataset_name: "*", name: "*_2d"}
        group: {era.name: "*", pipeline: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SplitAxes
            split_axis_names: ["variation"]
      output_name: "plots-2024-region5-plots/{era.name}/{pipeline}/{dataset_name}/{name}.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      scale: linear
      normalize: False
      show_info: True
      plot_configuration:
        x_axis_label: "m(bb) [GeV]"
      structure:
        select:
          dataset_name: "*"
          pipeline: "*"
          name: "re:^(m_Hbb_SPANet_1d|m_Hbb_top2b_dijet_1d)$"
        group: {era.name: "*", pipeline: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: FormatTitle
            title_format: "{name}"
      output_name: "plots-2024-region5-plots/{era.name}/{pipeline}/{dataset_name}/m_Hbb_SPANet_vs_top2b_dijet.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      scale: linear
      normalize: False
      show_info: True
      plot_configuration:
        x_axis_label: "m(Won) [GeV]"
      structure:
        select:
          dataset_name: "*"
          pipeline: "*"
          name: "re:^(m_W1_SPANet_1d|m_W1_nontop2b_dijet_1d)$"
        group: {era.name: "*", pipeline: "*", dataset_name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: FormatTitle
            title_format: "{name}"
      output_name: "plots-2024-region5-plots/{era.name}/{pipeline}/{dataset_name}/m_W1_SPANet_vs_nontop2b_dijet.png"

  default_plot_config:
    cms_text: "Preliminary"
    image_type: ".png"
    cms_text_color: Black
    legend_num_cols: 1
