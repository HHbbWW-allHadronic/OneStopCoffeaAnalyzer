{% macro objects() -%}
common_objects: &common_objects
  - module_name: RegressedMass
    input_col: FatJet
    output_col: FatJet.massRegressed

  - module_name: GlobalParT3XbbDiscriminator
    input_col: FatJet
    output_col: FatJet.xbb  


  - module_name: JetID
    input_col: Jet
    output_col: Jet.jetId

  - module_name: JetID
    input_col: FatJet
    output_col: FatJet.jetId

  - module_name: HElectronMaker
    input_col: Electron
    output_col: tightElectron
    working_point: "tight"
    min_pt: 15
    max_abs_eta: 2.5
    max_abs_dxy:
      barrel: 0.05
      endcap: 0.1
    max_abs_dz:
      barrel: 0.1
      endcap: 0.2

  - module_name: HElectronMaker
    input_col: Electron
    output_col: looseElectron
    working_point: "loose"
    min_pt: 7
    max_abs_eta: 2.5

  - module_name: HMuonMaker
    input_col: Muon
    output_col: tightMuon
    id_working_point: "tightId"
    min_pt: 15
    max_abs_eta: 2.4
    iso_working_pt: "tight"

  - module_name: HMuonMaker
    input_col: Muon
    output_col: looseMuon
    id_working_point: "looseId"
    min_pt: 5
    max_abs_eta: 2.4
    iso_working_pt: "loose"

  - module_name: HJetFilter
    input_col: Jet
    output_col: goodJet
    include_pu_id: False
    include_jet_id: True
    min_pt: 25
    max_abs_eta: 2.4

  - module_name: HJetFilter
    input_col: Jet
    output_col: goodQvGJet
    include_pu_id: False
    include_jet_id: True
    min_pt: 25
    max_abs_eta: 2.4
    min_btagPNetQvG: 0.3

  - module_name: HJetFilter
    input_col: Jet
    output_col: lowJet
    include_pu_id: False
    include_jet_id: True
    min_pt: 15
    max_abs_eta: 2.4

  - module_name: FatBQuarkMaker
    input_col: FatJet
    output_col: boostedFatJet
    min_mass: 50.0
    max_mass: 250.0
    min_xbb: 0.8

  - module_name: Count
    input_col: boostedFatJet
    output_col: NboostedFatJet
{%- endmacro %}

{% macro regions() -%}
hlt_selection: &hlt_selection
  - module_name: SimpleHLT
    triggers: [230AK8BB0p06]


hlt_selection2: &hlt_selection2
  - module_name: SimpleHLT
    triggers: [250AK8BB0p06]


hlt_selection3: &hlt_selection3
  - module_name: SimpleHLT
    triggers: [220AK82AK42B]


hlt_selection4: &hlt_selection4
  - module_name: SimpleHLT
    triggers: [230AK8BB0p10]

eventlevel_selection: &eventlevel_selection
  - module_name: GoldenLumi
  - module_name: VetoMap
    input_col: FatJet
  - module_name: VetoMapFilter
    input_col: FatJet
    output_col: FatJet
  - module_name: NoiseFilter

tightlep_fatquark_selection: &tightlep_fatquarks_selection
  - module_name: NObjFilter
    input_col: tightElectron
    selection_name: zero_electron
    min_count: 0
    max_count: 0

  - module_name: NObjFilter
    input_col: tightMuon
    selection_name: zero_muon
    min_count: 0
    max_count: 0

  - module_name: NObjFilter
    input_col: boostedFatJet
    selection_name: min_boosted_fatjet
    min_count: 1




withHLT_ObjDef1: &withHLT_ObjDef4
  - *common_objects
  - *hlt_selection4
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
  - *tightlep_fatquarks_selection
  - module_name: SelectOnColumns
    sel_name: selection

withHLT_ObjDef1: &withHLT_ObjDef3
  - *common_objects
  - *hlt_selection3
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
  - *tightlep_fatquarks_selection
  - module_name: SelectOnColumns
    sel_name: selection

withHLT_ObjDef1: &withHLT_ObjDef2
  - *common_objects
  - *hlt_selection2
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
  - *tightlep_fatquarks_selection
  - module_name: SelectOnColumns
    sel_name: selection

withHLT_ObjDef1: &withHLT_ObjDef1
  - *common_objects
  - *hlt_selection
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
  - *tightlep_fatquarks_selection
  - module_name: SelectOnColumns
    sel_name: selection

noHLT_ObjDef1: &noHLT_ObjDef1
  - *common_objects
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
  - *tightlep_fatquarks_selection
  - module_name: SelectOnColumns
    sel_name: selection

withHLT_NoSelection: &withHLT_NoSelection
  - *common_objects
  - *hlt_selection
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
  - module_name: SelectOnColumns
    sel_name: selection

NoSelection: &NoSelection
  - *common_objects
  - *eventlevel_selection
  - module_name: SelectOnColumns
    sel_name: preselection
{%- endmacro %}
