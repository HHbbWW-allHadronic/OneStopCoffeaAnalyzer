# H5 File Merge Configuration: boosted bbVV NN skim
# Merges the output of configurations/dihiggs/nn_skimming.yaml (scripts/merge_h5.py)
#   python merge_h5.py --config merge_boosted_config.yaml [--dry-run]

# Must match the SaveEventsH5 prefix in configurations/dihiggs/nn_skimming.yaml
source_dir: "root://cmseos.fnal.gov//store/user/jgehrke/skims/2024/raw/boosted_withHLT_ObjDef6"

output_dir: "./slimmedskims/2024/boosted_withHLT_ObjDef6/"

chunk_size: 8192

# Patterns are anchored on "{dataset_name}__{sample_name}__" so they cannot match
# the *_def9skim_* datasets.
groups:

  - name: "ggHH2b2V6q_training_2024"
    pattern: "^ggHH2b2V6q_training_2024__ggHH2b2V6q_training_2024__"

  - name: "qcd_inclusive__QCD_Bin-PT-1000to1500_TuneCP5_13p6TeV_pythia8"
    pattern: "^qcd_inclusive_2024__QCD_Bin-PT-1000to1500_TuneCP5_13p6TeV_pythia8__"

  - name: "qcd_inclusive__QCD_Bin-PT-120to170_TuneCP5_13p6TeV_pythia8"
